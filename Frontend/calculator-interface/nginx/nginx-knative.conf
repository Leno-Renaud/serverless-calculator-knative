server {
    listen 80;
    server_name localhost;

    # Serveur DNS Kubernetes (pour résoudre "backend" dynamiquement, même après un scale-to-zero)
    # 10.96.0.10 est l'IP standard de kube-dns, mais on utilise `valid=10s` pour forcer la re-résolution.
    # Dans certains environnements, un DNS proxy est fourni.
    resolver 10.43.0.10 valid=10s;

    # Servir les fichiers statiques React
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy vers le backend interne
    location /api/ {
        # On utilise une variable pour forcer Nginx à réévaluer la résolution DNS à chaque requête
        # C'est indispensable en Serverless (Knative) car l'IP du backend peut changer à chaque réveil.
        set $backend "http://backend.default.svc.cluster.local";
        
        # On supprime /api/ du chemin envoyé au backend
        rewrite ^/api/(.*) /$1 break;
        
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host backend.default.svc.cluster.local;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
