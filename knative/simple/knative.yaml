apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: worker
spec:
  template:
    spec:
      containers:
        - image: DOCKER_USERNAME/worker:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: FLASK_PORT
              value: "8000"
          ports:
            - containerPort: 8000

---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: backend
spec:
  template:
    spec:
      containers:
        - image: DOCKER_USERNAME/backend:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: WORKER_URL
              value: http://worker.default.svc.cluster.local
          ports:
            - containerPort: 3000

---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: frontend
spec:
  template:
    spec:
      containers:
        - image: DOCKER_USERNAME/frontend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80