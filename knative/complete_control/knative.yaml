apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: eml
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/class: kpa.autoscaling.knative.dev
        autoscaling.knative.dev/metric: concurrency
        autoscaling.knative.dev/target: "10"
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "5"
    spec:
      containerConcurrency: 10
      containers:
        - image: docker.io/DOCKER_USERNAME/eml:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: FLASK_PORT
              value: "10000"
          ports:
            - containerPort: 10000

---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: worker
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/class: kpa.autoscaling.knative.dev
        autoscaling.knative.dev/metric: concurrency
        autoscaling.knative.dev/target: "10"
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "5"
    spec:
      containerConcurrency: 10
      containers:
        - image: docker.io/DOCKER_USERNAME/worker:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: FLASK_PORT
              value: "8000"
            - name: EML_URL
              value: http://eml.default.svc.cluster.local
          ports:
            - containerPort: 8000

---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: backend
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/class: kpa.autoscaling.knative.dev
        autoscaling.knative.dev/metric: concurrency
        autoscaling.knative.dev/target: "10"
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "5"
    spec:
      containerConcurrency: 10
      containers:
        - image: docker.io/DOCKER_USERNAME/backend:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: WORKER_URL
              value: http://worker.default.svc.cluster.local
          ports:
            - containerPort: 3000

---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: frontend
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/class: kpa.autoscaling.knative.dev
        autoscaling.knative.dev/metric: concurrency
        autoscaling.knative.dev/target: "10"
        autoscaling.knative.dev/min-scale: "1"
        autoscaling.knative.dev/max-scale: "5"
    spec:
      containerConcurrency: 10
      containers:
        - image: docker.io/DOCKER_USERNAME/frontend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
